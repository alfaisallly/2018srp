# Nginx reverse proxy for DCMS
# Place in: /etc/nginx/sites-available/dcms
# Enable: ln -s /etc/nginx/sites-available/dcms /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d dcms.example.gov.iq

upstream dcms_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name dcms.example.gov.iq;

    client_max_body_size 50M;

    location / {
        proxy_pass http://dcms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
