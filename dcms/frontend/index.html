<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCMS - إدارة مراكز البيانات</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>DCMS — نظام إدارة مراكز البيانات</h1>
    <div id="user-info"></div>
  </header>

  <nav>
    <button class="nav-btn active" data-panel="dashboard">لوحة التحكم</button>
    <button class="nav-btn" data-panel="devices">الأجهزة</button>
    <button class="nav-btn" data-panel="network-map">خريطة الشبكة</button>
    <button class="nav-btn" data-panel="alerts">التنبيهات</button>
    <button class="nav-btn" data-panel="reports">التقارير</button>
  </nav>

  <main>
    <!-- Login -->
    <section id="login-panel" class="panel">
      <div class="card login-card">
        <h2>تسجيل الدخول</h2>
        <form id="login-form">
          <label>اسم المستخدم<input type="text" id="username" required value="admin"></label>
          <label>كلمة المرور<input type="password" id="password" required value="admin123"></label>
          <button type="submit">دخول</button>
        </form>
        <p id="login-error" class="error"></p>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-panel" class="panel hidden">
      <div class="stats-grid" id="stats-grid"></div>
      <div class="card">
        <h2>مراكز البيانات</h2>
        <div id="datacenters-list"></div>
      </div>
    </section>

    <!-- Devices -->
    <section id="devices-panel" class="panel hidden">
      <div class="card">
        <div class="toolbar">
          <h2>الأجهزة</h2>
          <button id="refresh-devices">تحديث</button>
        </div>
        <table id="devices-table">
          <thead>
            <tr>
              <th>الاسم</th><th>IP</th><th>المورّد</th><th>الحالة</th><th>آخر ظهور</th><th>إجراء</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Network Map -->
    <section id="network-map-panel" class="panel hidden">
      <div class="card">
        <div class="toolbar">
          <h2>خريطة الشبكة</h2>
          <select id="map-selector"></select>
          <button id="refresh-map">تحديث الخريطة</button>
        </div>
        <div id="network-graph"></div>
        <div id="map-legend">
          <span class="legend-item"><span class="dot cisco"></span>Cisco</span>
          <span class="legend-item"><span class="dot juniper"></span>Juniper</span>
          <span class="legend-item"><span class="dot fortinet"></span>Fortinet</span>
        </div>
      </div>
    </section>

    <!-- Alerts -->
    <section id="alerts-panel" class="panel hidden">
      <div class="card">
        <h2>التنبيهات</h2>
        <table id="alerts-table">
          <thead>
            <tr><th>العنوان</th><th>الخطورة</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Reports -->
    <section id="reports-panel" class="panel hidden">
      <div class="card">
        <h2>التقارير</h2>
        <p>تصدير تقرير PDF/HTML لمركز بيانات:</p>
        <select id="report-dc-selector"></select>
        <button id="download-report">تحميل التقرير</button>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
