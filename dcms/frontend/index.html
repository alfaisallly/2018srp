<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCMS - إدارة مراكز البيانات</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>DCMS — نظام إدارة مراكز البيانات</h1>
    <div id="user-info"></div>
  </header>

  <nav>
    <button class="nav-btn active" data-panel="dashboard">لوحة التحكم</button>
    <button class="nav-btn" data-panel="devices">الأجهزة</button>
    <button class="nav-btn" data-panel="network-map">خريطة الشبكة</button>
    <button class="nav-btn" data-panel="alerts">التنبيهات</button>
    <button class="nav-btn" data-panel="reports">التقارير</button>
  </nav>

  <main>
    <!-- Login -->
    <section id="login-panel" class="panel">
      <div class="card login-card">
        <h2>تسجيل الدخول</h2>
        <form id="login-form">
          <label>اسم المستخدم<input type="text" id="username" required value="admin"></label>
          <label>كلمة المرور<input type="password" id="password" required value="admin123"></label>
          <button type="submit">دخول</button>
        </form>
        <p id="login-error" class="error"></p>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-panel" class="panel hidden">
      <div class="stats-grid" id="stats-grid"></div>
      <div class="card">
        <h2>مراكز البيانات</h2>
        <div id="datacenters-list"></div>
      </div>
    </section>

    <!-- Devices -->
    <section id="devices-panel" class="panel hidden">
      <div class="card">
        <div class="toolbar">
          <h2>الأجهزة</h2>
          <div class="toolbar-actions">
            <button id="show-add-device" class="btn-secondary">+ إضافة جهاز</button>
            <button id="show-discover" class="btn-secondary">🔍 مسح الشبكة</button>
            <button id="poll-all-devices">فحص الكل</button>
            <button id="refresh-devices">تحديث</button>
          </div>
        </div>

        <!-- Add Device Form -->
        <div id="add-device-form" class="sub-form hidden">
          <h3>إضافة جهاز جديد</h3>
          <form id="device-create-form">
            <div class="form-grid">
              <label>مركز البيانات<select id="dev-dc" required></select></label>
              <label>الاسم<input type="text" id="dev-name" required placeholder="Core-SW-01"></label>
              <label>Hostname<input type="text" id="dev-hostname" required placeholder="core-sw-01"></label>
              <label>IP Address<input type="text" id="dev-ip" required placeholder="192.168.10.1"></label>
              <label>المورّد
                <select id="dev-vendor" required>
                  <option value="cisco">Cisco</option>
                  <option value="juniper">Juniper</option>
                  <option value="fortinet">Fortinet</option>
                </select>
              </label>
              <label>البروتوكول
                <select id="dev-protocol" required>
                  <option value="snmp">SNMP</option>
                  <option value="ssh">SSH</option>
                  <option value="netconf">NETCONF</option>
                  <option value="rest">REST API</option>
                </select>
              </label>
              <label id="lbl-community">Community (SNMP)<input type="text" id="dev-community" value="public"></label>
              <label id="lbl-username" class="hidden">Username<input type="text" id="dev-username"></label>
              <label id="lbl-password" class="hidden">Password<input type="password" id="dev-password"></label>
              <label id="lbl-token" class="hidden">API Token<input type="text" id="dev-token"></label>
              <label>Port<input type="number" id="dev-port" placeholder="تلقائي"></label>
            </div>
            <div class="form-actions">
              <button type="submit">حفظ وإضافة</button>
              <button type="button" id="cancel-add-device" class="btn-secondary">إلغاء</button>
            </div>
          </form>
          <p id="add-device-msg" class="error"></p>
        </div>

        <!-- Network Discovery -->
        <div id="discover-form" class="sub-form hidden">
          <h3>مسح الشبكة (SNMP)</h3>
          <form id="network-discover-form">
            <div class="form-grid">
              <label>مركز البيانات<select id="disc-dc" required></select></label>
              <label>نطاق CIDR<input type="text" id="disc-cidr" placeholder="192.168.10.0/24"></label>
              <label>أو: IP البداية<input type="text" id="disc-start" placeholder="192.168.10.1"></label>
              <label>IP النهاية<input type="text" id="disc-end" placeholder="192.168.10.50"></label>
              <label>SNMP Community<input type="text" id="disc-community" value="public" required></label>
              <label>Port<input type="number" id="disc-port" value="161"></label>
            </div>
            <div class="form-actions">
              <button type="submit">بدء المسح</button>
              <button type="button" id="cancel-discover" class="btn-secondary">إلغاء</button>
            </div>
          </form>
          <p id="discover-status" class="muted"></p>
          <div id="discover-results"></div>
        </div>

        <table id="devices-table">
          <thead>
            <tr>
              <th>الاسم</th><th>IP</th><th>المورّد</th><th>الحالة</th><th>آخر ظهور</th><th>إجراء</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Network Map -->
    <section id="network-map-panel" class="panel hidden">
      <div class="card">
        <div class="toolbar">
          <h2>خريطة الشبكة</h2>
          <select id="map-selector"></select>
          <button id="refresh-map">تحديث الخريطة</button>
        </div>
        <div id="network-graph"></div>
        <div id="map-legend">
          <span class="legend-item"><span class="dot cisco"></span>Cisco</span>
          <span class="legend-item"><span class="dot juniper"></span>Juniper</span>
          <span class="legend-item"><span class="dot fortinet"></span>Fortinet</span>
        </div>
      </div>
    </section>

    <!-- Alerts -->
    <section id="alerts-panel" class="panel hidden">
      <div class="card">
        <h2>التنبيهات</h2>
        <table id="alerts-table">
          <thead>
            <tr><th>العنوان</th><th>الخطورة</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Reports -->
    <section id="reports-panel" class="panel hidden">
      <div class="card">
        <h2>التقارير</h2>
        <p>تصدير تقرير PDF/HTML لمركز بيانات:</p>
        <select id="report-dc-selector"></select>
        <button id="download-report">تحميل التقرير</button>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
